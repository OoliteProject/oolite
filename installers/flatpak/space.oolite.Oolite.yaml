app-id: space.oolite.Oolite
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
build-options:
  append-path: /usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
command: run_oolite.sh
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=/dev/input:ro
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.a"
  - "*.la"
modules:
  - name: typst
    buildsystem: simple
    build-commands:
      - install -Dm755 typst /app/bin/typst
    sources:
      - type: archive
        url: https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
        sha256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
        strip-components: 1
  - shared-modules/glu/glu-9.json
  - name: pcaudiolib
    sources:
      - type: archive
        url: "https://github.com/espeak-ng/pcaudiolib/archive/refs/tags/1.3.tar.gz"
        sha256: "86edb75048eec7fcd8d74f9568f051d50b4781982215095b96ba9c2c9c7c159b"
  - name: espeak-ng
    sources:
      - type: archive
        url: "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz"
        sha256: "bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23"
  - name: sdl3
    buildsystem: cmake-ninja
    build-options:
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.4.8
  - name: oolite
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      # Update --ver-full for FlatHub release. For CI and local builds, create_flatpak.sh replaces
      # --ver-full and --github-repository values
      - ./mk.sh flatpak deployment --setup-flags="-Ddocs=enabled" --ver-full="1.92.1" --buildtime="2026.03.19 07:13" --github-repository="OoliteProject/oolite"
    sources:
      # Update tag and commit for FlatHub release. For CI and local builds, create_flatpak.sh replaces git source with:
      # - type: dir
      #   path: ../../
      - type: git
        url: https://github.com/OoliteProject/oolite.git
        tag: "1.92.1.0"
        commit: dd117d31c2f0e756d478e64584120d3d5cbf64d8
      # QuickJS-ng, the JS engine, is a meson subproject (subprojects/quickjs-ng.wrap) linked
      # statically into oolite. The flatpak build is offline, so its wrap tarball is fetched here
      # and placed where meson's subproject packagecache looks for it.
      - type: file
        url: https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.17.0.tar.gz
        sha256: 559bc4c420475e55c7ab4510adbc562f55d7524d75e8e89d79ce4bb02f5687d9
        dest: subprojects/packagecache
        dest-filename: quickjs-ng-0.17.0.tar.gz
