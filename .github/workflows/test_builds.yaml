name: Test Oolite package on various platforms
on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        js_engine: [spidermonkey, quickjs]
    name: ubuntu (${{ matrix.js_engine }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Ubuntu
        run: |
          apt update          
          apt install -y git curl ca-certificates
      - name: Pre-setup ownership & curl token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This must run before the checkout action if the action tries to do git commands
          mkdir -p "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
          echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          ShellScripts/Linux/install_packages_root.sh --core+appimage
      - name: Build GNUstep
        run: |
          ShellScripts/Linux/build_gnustep.sh system
          echo "/usr/local/lib" | tee -a /etc/ld.so.conf
          ldconfig
      - name: Install Mozilla static library
        if: matrix.js_engine == 'spidermonkey'
        run: |
          ShellScripts/Linux/install_mozilla_js.sh system
      - name: Build Oolite
        run: |
          ./mk.sh build deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
      - name: Test Oolite
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        run: |
          ./mk.sh test deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
      - name: Build AppImage
        run: |
          ./mk.sh pkg-appimage deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
      - name: Build Oolite (dev, compile check only)
        run: |
          ./mk.sh build dev --setup-flags="-Djs_engine=${{ matrix.js_engine }}"

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Fedora
        run: |
          dnf -y update
          dnf -y install git
      - name: Pre-setup ownership & curl token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This must run before the checkout action if the action tries to do git commands
          mkdir -p "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
          echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          ShellScripts/Linux/install_packages_root.sh --core+appimage
      - name: Build GNUstep
        run: |
          ShellScripts/Linux/build_gnustep.sh system
      - name: Install Mozilla static library
        run: |
          ShellScripts/Linux/install_mozilla_js.sh system
          echo "/usr/local/lib64" | tee -a /etc/ld.so.conf
          ldconfig
      - name: Build Oolite
        run: |
          ./mk.sh build deployment
      - name: Test Oolite
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        run: |
          ./mk.sh test deployment
      - name: Build AppImage
        run: |
          ./mk.sh pkg-appimage deployment

  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Arch
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git
      - name: Pre-setup ownership & curl token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This must run before the checkout action if the action tries to do git commands
          mkdir -p "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
          echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          ShellScripts/Linux/install_packages_root.sh --core+appimage
      - name: Build GNUstep
        run: |
          ShellScripts/Linux/build_gnustep.sh system
      - name: Install Mozilla static library
        run: |
          ShellScripts/Linux/install_mozilla_js.sh system
          echo "/usr/local/lib" | tee -a /etc/ld.so.conf
          ldconfig
      - name: Build Oolite
        run: |
          ./mk.sh build deployment
      - name: Test Oolite
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        run: |
          ./mk.sh test deployment
      - name: Build AppImage
        run: |
          ./mk.sh pkg-appimage deployment

  windows:
    strategy:
      fail-fast: false
      matrix:
        js_engine: [spidermonkey, quickjs]
    name: windows (${{ matrix.js_engine }})
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install packages
        shell: msys2 {0}
        env:
          MSYSTEM: UCRT64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
          echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc
          cp ~/.curlrc /c/Users/runneradmin/.curlrc 2>/dev/null || true          
          ShellScripts/Windows/install_deps.sh clang

      - name: Build Oolite
        shell: msys2 {0}
        env:
          MSYSTEM: UCRT64
          PYTHONUTF8: "1"
        run: |
          ./mk.sh build deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"

      - name: Test Oolite
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        shell: msys2 {0}
        env:
          MSYSTEM: UCRT64
          PYTHONUTF8: "1"
        run: |
          if ./mk.sh test deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"; then
            echo "✅ Oolite test completed successfully"
          else
            echo "❌ Oolite test failed" >&2
            cd build/meson_deployment/oolite.app
            ntldd -R oolite.exe
            exit 1
          fi

  macos:
    strategy:
      fail-fast: false
      matrix:
        js_engine: [spidermonkey, quickjs]
    name: macos (${{ matrix.js_engine }})
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          ShellScripts/macOS/install_packages.sh
      - name: Restore Mozilla static library
        if: matrix.js_engine == 'spidermonkey'
        id: mozilla-js-cache
        uses: actions/cache@v4
        with:
          path: build/mozilla_js
          key: mozilla-js-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ShellScripts/macOS/build_mozilla_js.sh', 'ShellScripts/macOS/mozilla_js_arm64.patch') }}
      - name: Build Mozilla static library
        if: matrix.js_engine == 'spidermonkey' && steps.mozilla-js-cache.outputs.cache-hit != 'true'
        run: |
          ShellScripts/macOS/build_mozilla_js.sh
      - name: Build Oolite
        run: |
          ./mk.sh build deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
      - name: Test Oolite
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        run: |
          ./mk.sh test deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
      - name: Build DMG
        run: |
          ./mk.sh pkg-dmg deployment --setup-flags="-Djs_engine=${{ matrix.js_engine }}"
