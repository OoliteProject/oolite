version: 2
build:
  os: ubuntu-26.04
  tools:
    python: "3.13"
  apt_packages:
    - doxygen
    - graphviz
    - jq
    - libharfbuzz0b
    - libpango-1.0-0
    - libpangoft2-1.0-0
    - shared-mime-info
  jobs:
    pre_build:
      - ./build_readthedocs.sh

mkdocs:
  configuration: build/documentation/mkdocs.yaml

python:
  install:
    - requirements: ./Documentation/requirements.txt
