version: 2
build:
  os: ubuntu-26.04
  tools:
    python: "3.13"
  apt_packages:
    - doxygen
    - graphviz
    - jq
    - libharfbuzz0b
    - libpango-1.0-0
    - libpangoft2-1.0-0
    - shared-mime-info
  jobs:
    pre_build:
      - mkdir -p ~/.local/bin && export PATH="$HOME/.local/bin:$PATH"
      - ./ShellScripts/Linux/install_doc_packages.sh ~/.local/bin
      - ./Documentation/build_doxygen.sh
      - ./Documentation/build_mds.sh
      - ./Documentation/build_referencesheet.sh

mkdocs:
  configuration: build/documentation/mkdocs.yaml

python:
  install:
    - requirements: ./Documentation/requirements.txt
