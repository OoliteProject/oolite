[pytest]
# The tier imports conftest.py as a top-level module (row_to_point and the G9 hygiene assert are
# plain functions, not fixtures), so its own directory has to be on sys.path regardless of where
# pytest was invoked from. Same arrangement as tests/component/pytest.ini.
pythonpath = .
markers =
    offline: needs neither a desktop nor a built game; runnable in a clean checkout.
